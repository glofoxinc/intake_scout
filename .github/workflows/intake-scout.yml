name: Intake Scout

on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [intake-scout]
  workflow_dispatch:
    inputs:
      issue_key:
        description: AN or PIC issue key (blank = poll last 30 minutes)
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Intake Scout
        working-directory: automation
        env:
          JIRA_BASE: ${{ vars.JIRA_BASE || 'https://abcfinancial.atlassian.net' }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
        run: python poller.py
